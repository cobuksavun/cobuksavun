<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CyberAcademy SIEM - Live Dashboard</title>
    <style>
        body { margin: 0; padding: 0; font-family: Segoe UI, sans-serif; background: #0f1419; color: #e0e6ed; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 220px; background: #1a1f2e; padding: 20px; border-right: 1px solid #2a3142; }
        .logo { font-size: 16px; font-weight: 600; color: #00d4ff; margin-bottom: 30px; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .topbar { background: #1a1f2e; border-bottom: 1px solid #2a3142; padding: 15px 25px; display: flex; justify-content: space-between; }
        .content { flex: 1; overflow-y: auto; padding: 25px; }
        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .card { background: #1a1f2e; border: 1px solid #2a3142; border-left: 4px solid #00d4ff; padding: 16px; border-radius: 8px; text-align: center; }
        .card.critical { border-left-color: #e24b4a; }
        .card.high { border-left-color: #ba7517; }
        .card.medium { border-left-color: #ef9f27; }
        .num { font-size: 32px; font-weight: 600; color: #e0e6ed; margin: 10px 0; }
        .label { font-size: 11px; text-transform: uppercase; color: #5a6b7d; }
        .table-section { background: #1a1f2e; border: 1px solid #2a3142; border-radius: 8px; padding: 20px; }
        table { width: 100%; font-size: 12px; border-collapse: collapse; }
        th { background: #0f1419; color: #5a6b7d; padding: 12px; text-align: left; border-bottom: 1px solid #2a3142; }
        td { padding: 12px; border-bottom: 1px solid #2a3142; }
        tr:hover { background: #252d3d; }
        .ip { color: #00d4ff; }
        .status { color: #90ee90; }
        .loading { opacity: 0.6; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">🛡️ CyberAcademy</div>
            <div style="color: #00d4ff; padding: 10px;">Dashboard</div>
        </div>
        <div class="main">
            <div class="topbar">
                <div>Live SIEM Dashboard</div>
                <div class="status">● Connected</div>
            </div>
            <div class="content">
                <h1>Real-time Monitoring</h1>
                <div class="cards">
                    <div class="card critical">
                        <div class="label">Critical</div>
                        <div class="num" id="critical">0</div>
                        <div style="font-size: 12px; color: #a0aec0;">Loading...</div>
                    </div>
                    <div class="card high">
                        <div class="label">High</div>
                        <div class="num" id="high">0</div>
                        <div style="font-size: 12px; color: #a0aec0;">Loading...</div>
                    </div>
                    <div class="card medium">
                        <div class="label">Medium</div>
                        <div class="num" id="medium">0</div>
                        <div style="font-size: 12px; color: #a0aec0;">Loading...</div>
                    </div>
                    <div class="card low">
                        <div class="label">Low</div>
                        <div class="num" id="low">0</div>
                        <div style="font-size: 12px; color: #a0aec0;">Loading...</div>
                    </div>
                </div>
                <div class="table-section">
                    <h2>Recent Logs (Brute Force Attack)</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Source IP</th>
                                <th>User</th>
                                <th>Action</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="logs"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://cobuklsavun-production.up.railway.app';

        async function load() {
            try {
                // Fetch logs
                const logsRes = await fetch(API + '/api/logs?log_type=WINDOWS_EVENT&limit=20');
                const logsData = await logsRes.json();
                const logs = logsData.logs || [];

                // Fetch alerts
                const alertsRes = await fetch(API + '/api/alerts/summary');
                const alertsData = await alertsRes.json();
                const alerts = alertsData.summary || {};

                // Update alerts
                document.getElementById('critical').textContent = alerts.critical || 0;
                document.getElementById('high').textContent = alerts.high || 0;
                document.getElementById('medium').textContent = alerts.medium || 0;
                document.getElementById('low').textContent = alerts.low || 0;

                // Update logs
                const tbody = document.getElementById('logs');
                tbody.innerHTML = logs.map(log => `
                    <tr>
                        <td>${new Date(log.timestamp).toLocaleString()}</td>
                        <td><span class="ip">${log.source_ip}</span></td>
                        <td>${log.user_name || '-'}</td>
                        <td>${log.action}</td>
                        <td>${log.result === 'failed' ? '❌ Failed' : '✓ Success'}</td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById('logs').innerHTML = `<tr><td colspan="5" style="color: #e24b4a;">Error: ${err.message}</td></tr>`;
            }
        }

        load();
        setInterval(load, 10000);
    </script>
</body>
</html>
